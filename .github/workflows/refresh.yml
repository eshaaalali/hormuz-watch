name: Refresh Hormuz Watch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-hormuz-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest data and rebuild the page
        run: python scripts/refresh_data.py

      - name: Commit and push if the site changed
        run: |
          git config user.name "hormuz-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html data/combined.json
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d')"
            git push
          fi
